version: 2
updates:
  # ルートディレクトリ（開発ツール）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "SatoshiMoriyama"
    labels:
      - "dependencies"
      - "dev-tools"

  # API パッケージ
  - package-ecosystem: "npm"
    directory: "/packages/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    reviewers:
      - "SatoshiMoriyama"
    labels:
      - "dependencies"
      - "api"

  # CDK パッケージ
  - package-ecosystem: "npm"
    directory: "/packages/cdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    reviewers:
      - "SatoshiMoriyama"
    labels:
      - "dependencies"
      - "cdk"